name: UTAGEへ反映

# index.html / images/ / utage/ を変更して push すると、
# 画像をUTAGEへ同期し、HTMLを生成してUTAGEのページを更新する。
#
# utage/config.json の funnel_id・step_id・page_id・origin_cta が
# 空のあいだは、何もせずスキップする（設定前にジョブが赤くならないように）。
on:
  push:
    branches-ignore:
      - 'claude/**'
    paths:
      - 'index.html'
      - 'images/**'
      - 'utage/**'
      - '.github/workflows/deploy-utage.yml'
  workflow_dispatch:

concurrency:
  group: deploy-utage
  cancel-in-progress: false

permissions:
  contents: write           # 画像の控え（images.map.json）を書き戻すため

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: UTAGEの設定が入っているか確認
        id: gate
        run: |
          missing=$(node -e '
            const c = require("./utage/config.json");
            const miss = [];
            if (!c.funnel_id)  miss.push("funnel_id");
            if (!c.origin_cta) miss.push("origin_cta");
            for (const v of c.variants) {
              if (!v.step_id) miss.push(`variants[${v.key}].step_id`);
              if (!v.page_id) miss.push(`variants[${v.key}].page_id`);
              if (!v.cta)     miss.push(`variants[${v.key}].cta`);
            }
            process.stdout.write(miss.join(", "));
          ')
          if [[ -n "$missing" ]]; then
            echo "utage/config.json が未設定のためスキップします（未設定: $missing）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 画像をUTAGEへ同期
        if: steps.gate.outputs.ready == 'true'
        env:
          UTAGE_API_KEY: ${{ secrets.UTAGE_API_KEY }}
        run: node utage/sync-images.mjs

      - name: 反映用のHTMLを生成
        if: steps.gate.outputs.ready == 'true'
        run: node utage/build.mjs && node utage/build-single.mjs

      - name: UTAGEへ反映
        if: steps.gate.outputs.ready == 'true'
        env:
          UTAGE_API_KEY: ${{ secrets.UTAGE_API_KEY }}
        run: node utage/deploy.mjs

      - name: 生成物をリポジトリに反映
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [[ -n "$(git status --porcelain utage/images.map.json dist/utage.html)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add utage/images.map.json dist/utage.html
            git commit -m "chore: 画像の控えとUTAGE用HTMLを更新 [skip ci]"
            git push
          else
            echo "変更はありません"
          fi
